apply plugin: "com.android.application"
apply plugin: "kotlin-android"
apply plugin: "com.facebook.react"

react {
    // Defaults work for a standard layout: root = "../..", entry = index.js
}

def jscFlavor = 'org.webkit:android-jsc:+'

// versionCode: the number of commits, so every build (CI or local) installs over an older one; versionName: "1.0.N"
// from CI (BUDGETAPP_VERSION_NAME), a local build says "-dev"
def commitCount = { ->
    try { return 'git rev-list --count HEAD'.execute(null, rootDir).text.trim().toInteger() } catch (ignored) { return 1 }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    namespace "com.budgetapp"

    defaultConfig {
        applicationId "com.budgetapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode commitCount()
        versionName(project.findProperty('BUDGETAPP_VERSION_NAME') ?: "1.0-dev")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Credentials come from ~/.gradle/gradle.properties so the key never enters the repo.
        // Keep the keystore backed up: an APK signed with another key can't update the installed
        // app, it must be uninstalled first — which deletes the transaction database.
        if (project.hasProperty('BUDGETAPP_RELEASE_STORE_FILE')) {
            release {
                storeFile file(BUDGETAPP_RELEASE_STORE_FILE)
                storePassword BUDGETAPP_RELEASE_STORE_PASSWORD
                keyAlias BUDGETAPP_RELEASE_KEY_ALIAS
                keyPassword BUDGETAPP_RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Without the release key: debug signing only when asked for (-PallowDebugSigning), see the check below.
            // An APK signed with the debug key can't update the phone's app (installed with the release key)
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.0.0")
    // the system fingerprint / face window for "Блокировка" (lock/AppLockModule.kt)
    implementation("androidx.biometric:biometric:1.1.0")
    implementation("org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)

// A release build without the release key stops here instead of quietly signing with the debug key
gradle.taskGraph.whenReady { graph ->
    def releasing = graph.allTasks.any { it.project == project && it.name ==~ /(assemble|bundle|package)Release/ }
    if (releasing && android.signingConfigs.findByName('release') == null && !project.hasProperty('allowDebugSigning')) {
        throw new GradleException(
            "No release key: set BUDGETAPP_RELEASE_STORE_FILE / _STORE_PASSWORD / _KEY_ALIAS / _KEY_PASSWORD in " +
            "~/.gradle/gradle.properties, or build with -PallowDebugSigning (such an APK can't update the phone's app)")
    }
}
