apply plugin: "com.android.application"
apply plugin: "kotlin-android"
apply plugin: "com.facebook.react"

react {
    // Defaults work for a standard layout: root = "../..", entry = index.js
}

def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    namespace "com.budgetapp"

    defaultConfig {
        applicationId "com.budgetapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Credentials come from ~/.gradle/gradle.properties so the key never enters the repo.
        // Keep the keystore backed up: an APK signed with another key can't update the installed
        // app, it must be uninstalled first — which deletes the transaction database.
        if (project.hasProperty('BUDGETAPP_RELEASE_STORE_FILE')) {
            release {
                storeFile file(BUDGETAPP_RELEASE_STORE_FILE)
                storePassword BUDGETAPP_RELEASE_STORE_PASSWORD
                keyAlias BUDGETAPP_RELEASE_KEY_ALIAS
                keyPassword BUDGETAPP_RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Without the release key configured, fall back to debug signing so the build still works
            signingConfig signingConfigs.findByName('release') ?: signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("androidx.swiperefreshlayout:swiperefreshlayout:1.0.0")
    implementation("org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
