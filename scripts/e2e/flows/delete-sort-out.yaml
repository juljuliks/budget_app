# Operations this month, to several categories: the operations list sorting them out (by merchant, locked to the
# category), a merchant moved with this month only, one operation alone, one to none; then where they went and
# the delete.
appId: com.budgetapp
---
- launchApp
- runFlow:
    file: common/open-category.yaml
    env:
      CATEGORY: Покупки
- tapOn: "Удалить категорию"
- tapOn:
    id: "delete-sort-out"
- extendedWaitUntil:
    visible: "Удаление «.*Покупки»: осталось 4 операции на 360.*"
    timeout: 15000
# grouped by merchant, the busiest first
- assertVisible: "По мерчантам"
- assertVisible: "ZARA · 2 операции"

# ZARA, the whole group, and the merchant too
- tapOn:
    id: "group-checkbox-ZARA"
- tapOn:
    id: "bulk-category"
- tapOn: ".*Одежда"
- extendedWaitUntil:
    visible: "Категория «.*Одежда» — только для выбранных операций или и для мерчанта\\?"
    timeout: 10000
- assertVisible: "Мерчант ZARA получит категорию «.*Одежда» — его новые операции будут попадать туда\\. Прошлые месяцы останутся в «.*Покупки»\\."
- tapOn: "И для мерчанта"
- extendedWaitUntil:
    visible: "Удаление «.*Покупки»: осталось 2 операции на 110.*"
    timeout: 10000

# HM: the operation only
# one operation: no checkbox on its header, the row picks it
- tapOn: "HM"
- tapOn:
    id: "bulk-category"
- tapOn: ".*Техника"
- tapOn: "Только для выбранных \\(1\\)"
- extendedWaitUntil:
    visible: "Удаление «.*Покупки»: осталась 1 операция на 30.*"
    timeout: 10000

# WOLT: no category (nothing to ask)
# one operation: no checkbox on its header, the row picks it
- tapOn: "WOLT"
- tapOn:
    id: "bulk-category"
- tapOn: ".*Без категории"

# nothing left: where they went, the merchants still on it, the delete
- extendedWaitUntil:
    visible: "Все операции перенесены"
    timeout: 10000
- assertVisible: "(?s)4 операции на 360.*:.*• в «.*Одежда» — 2 на 250.*• в «.*Техника» — 1 на 80.*• без категории — 1 на 30.*2 мерчанта \\(APPLE, HM\\) всё ещё с категорией «.*Покупки» — после удаления останутся без категории\\..*"
- tapOn: "Удалить «.*Покупки»"
- extendedWaitUntil:
    notVisible:
      id: "sort-out-banner"
    timeout: 10000
