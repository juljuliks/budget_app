# Settings → Категории → the category ${CATEGORY}: its card
appId: com.budgetapp
---
- extendedWaitUntil:
    visible: "Настройки"
    timeout: 60000
- tapOn: "Настройки"
- tapOn: "Категории"
# the seed's categories come after the default ones: may be below the screen
- scrollUntilVisible:
    element: ".*${CATEGORY}"
    direction: DOWN
    timeout: 20000
- tapOn: ".*${CATEGORY}"
- extendedWaitUntil:
    visible: "Удалить категорию"
    timeout: 10000
