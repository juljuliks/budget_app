# Screenshots of the main screens of a published build, on demand (Actions → "Screenshots" → Run workflow, or the
# API): an Android 13 emulator, an x86_64 APK of that build's commit (built here, not taken from the release) with a
# demo database in place of the app's (scripts/demo), Maestro shooting the month, week, day, plan and operations
# screens. The PNGs are added to that build's release as screenshots-1.0.N.zip. The APK is not. Not run on every
# push: the emulator takes ~10 minutes.
name: Screenshots

on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Release tag, e.g. v1.0.3 (empty: the latest build)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Which build
        id: build
        run: |
          TAG="${{ inputs.build }}"
          [ -n "$TAG" ] || TAG="$(gh release view --json tagName -q .tagName)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "number=${TAG#v}" >> "$GITHUB_OUTPUT"
          # the demo database and the flows of that build's code (its schema)
          git checkout --quiet "$TAG"

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # Maestro runs on Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install JS dependencies
        run: npm ci

      - name: Emulator APK
        id: apk
        working-directory: android
        env:
          KEYSTORE: ${{ secrets.BUDGETAPP_KEYSTORE_BASE64 }}
          ORG_GRADLE_PROJECT_BUDGETAPP_RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          ORG_GRADLE_PROJECT_BUDGETAPP_RELEASE_STORE_PASSWORD: ${{ secrets.BUDGETAPP_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_BUDGETAPP_RELEASE_KEY_ALIAS: ${{ secrets.BUDGETAPP_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_BUDGETAPP_RELEASE_KEY_PASSWORD: ${{ secrets.BUDGETAPP_RELEASE_KEY_PASSWORD }}
        run: |
          # an older release may still carry the emulator APK; a new one does not, so build it and do not upload it
          mkdir -p "$RUNNER_TEMP/apk"
          gh release download "${{ steps.build.outputs.tag }}" -p '*x86_64*.apk' -D "$RUNNER_TEMP/apk" || true
          FOUND="$(find "$RUNNER_TEMP/apk" -name '*x86_64*.apk' -print -quit)"
          if [ -n "$FOUND" ]; then echo "apk=$FOUND" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$KEYSTORE" ] || [ -z "$ORG_GRADLE_PROJECT_BUDGETAPP_RELEASE_STORE_PASSWORD" ] || [ -z "$ORG_GRADLE_PROJECT_BUDGETAPP_RELEASE_KEY_ALIAS" ] || [ -z "$ORG_GRADLE_PROJECT_BUDGETAPP_RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Release key secrets are not set (see android-release.yml)."
            exit 1
          fi
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -PabiSplits -PreactNativeArchitectures=x86_64
          APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-x86_64-release.apk"
          test -f "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Demo database
        run: |
          npx tsc -p scripts/demo
          node dist-demo/scripts/demo/demoDb.js "$RUNNER_TEMP/demo.db"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash

      - name: Shoot the screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/demo/screenshots.sh "${{ steps.apk.outputs.apk }}" "$RUNNER_TEMP/demo.db" "$RUNNER_TEMP/screenshots"

      - name: Add them to the release
        run: |
          ZIP="$RUNNER_TEMP/screenshots-${{ steps.build.outputs.number }}.zip"
          (cd "$RUNNER_TEMP/screenshots" && zip -r "$ZIP" . -i '*.png')
          gh release upload "${{ steps.build.outputs.tag }}" "$ZIP" --clobber
