# Screenshots of the main screens of a published build, on demand (Actions → "Screenshots" → Run workflow, or the
# API): an Android 13 emulator, the build's APK with a demo database in place of the app's (scripts/demo), Maestro
# shooting the month, week, day, plan and operations screens. The PNGs are added to that build's release as
# screenshots-N.zip. Not run on every push: the emulator takes ~10 minutes.
name: Screenshots

on:
  workflow_dispatch:
    inputs:
      build:
        description: 'Release tag, e.g. build-52 (empty: the latest build)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Which build
        id: build
        run: |
          TAG="${{ inputs.build }}"
          [ -n "$TAG" ] || TAG="$(gh release view --json tagName -q .tagName)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "number=${TAG#build-}" >> "$GITHUB_OUTPUT"
          # the demo database and the flows of that build's code (its schema)
          git checkout --quiet "$TAG"
          gh release download "$TAG" -p 'budget-app-*.apk' -D "$RUNNER_TEMP/apk"
          ls "$RUNNER_TEMP/apk"

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # Maestro runs on Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: npm ci

      - name: Demo database
        run: |
          npx tsc -p scripts/demo
          node dist-demo/scripts/demo/demoDb.js "$RUNNER_TEMP/demo.db"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash

      - name: Shoot the screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/demo/screenshots.sh "$(ls $RUNNER_TEMP/apk/*.apk | head -1)" "$RUNNER_TEMP/demo.db" "$RUNNER_TEMP/screenshots"

      - name: Add them to the release
        run: |
          ZIP="$RUNNER_TEMP/screenshots-${{ steps.build.outputs.number }}.zip"
          (cd "$RUNNER_TEMP/screenshots" && zip -r "$ZIP" . -i '*.png')
          gh release upload "${{ steps.build.outputs.tag }}" "$ZIP" --clobber
