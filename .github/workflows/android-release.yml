# Builds the release APK, signed with the app's release key, on every push to main (or by hand from the Actions
# tab), and publishes it as a GitHub release — so a new build can be downloaded and installed right from the phone.
#
# One-time setup (repo → Settings → Secrets and variables → Actions → New repository secret):
#   BUDGETAPP_KEYSTORE_BASE64          the release keystore file as base64 (macOS: base64 -i release.keystore | pbcopy)
#   BUDGETAPP_RELEASE_STORE_PASSWORD   from ~/.gradle/gradle.properties
#   BUDGETAPP_RELEASE_KEY_ALIAS        from ~/.gradle/gradle.properties
#   BUDGETAPP_RELEASE_KEY_PASSWORD     from ~/.gradle/gradle.properties
# Without them the build stops: an APK signed with another key can't update the installed app (it would have to be
# uninstalled, which deletes its transactions).
name: Android release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the release key secrets
        env:
          KEYSTORE: ${{ secrets.BUDGETAPP_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BUDGETAPP_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUDGETAPP_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUDGETAPP_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release key secrets are not set (see the comment at the top of this workflow)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install JS dependencies
        run: npm ci

      - name: Tests
        run: npx tsc --noEmit && npx jest --silent

      - name: Release keystore
        env:
          KEYSTORE: ${{ secrets.BUDGETAPP_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build the release APK
        working-directory: android
        env:
          # Gradle reads ORG_GRADLE_PROJECT_* as project properties: the same names as in ~/.gradle/gradle.properties
          ORG_GRADLE_PROJECT_BUDGETAPP_RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          ORG_GRADLE_PROJECT_BUDGETAPP_RELEASE_STORE_PASSWORD: ${{ secrets.BUDGETAPP_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_BUDGETAPP_RELEASE_KEY_ALIAS: ${{ secrets.BUDGETAPP_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_BUDGETAPP_RELEASE_KEY_PASSWORD: ${{ secrets.BUDGETAPP_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/budget-app-${{ github.run_number }}.apk"

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          body: |
            Коммит ${{ github.sha }}: ${{ github.event.head_commit.message }}

            Скачайте `budget-app-${{ github.run_number }}.apk` на телефоне и откройте — установится поверх, данные сохранятся.
          files: ${{ runner.temp }}/budget-app-${{ github.run_number }}.apk
          make_latest: true

      # for the screenshots job
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ runner.temp }}/budget-app-${{ github.run_number }}.apk
          retention-days: 3

  # The main screens on an emulator with a demo database (scripts/demo), shot by Maestro and added to the release as
  # screenshots-N.zip — to check the layout of a build without a phone. Its failure doesn't touch the release.
  screenshots:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # Maestro runs on Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: npm ci

      - name: Demo database
        run: |
          npx tsc -p scripts/demo
          node dist-demo/scripts/demo/demoDb.js "$RUNNER_TEMP/demo.db"

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: ${{ runner.temp }}/apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        run: curl -fsSL "https://get.maestro.mobile.dev" | bash

      - name: Shoot the screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/demo/screenshots.sh "$RUNNER_TEMP/apk/budget-app-${{ github.run_number }}.apk" "$RUNNER_TEMP/demo.db" "$RUNNER_TEMP/screenshots"

      - name: Pack the screenshots
        run: cd "$RUNNER_TEMP/screenshots" && zip -r "$RUNNER_TEMP/screenshots-${{ github.run_number }}.zip" . -i '*.png'

      - name: Add them to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: ${{ runner.temp }}/screenshots-${{ github.run_number }}.zip
          make_latest: true
