# Builds the release APK, signed with the app's release key, on every push to main (or by hand from the Actions
# tab), and publishes it as a GitHub release "1.0.N" — so a new build can be downloaded and installed right from the
# phone. N counts the builds since 1.0.0; only the last KEEP_RELEASES releases are kept.
#
# One-time setup (repo → Settings → Secrets and variables → Actions → New repository secret):
#   BUDGETAPP_KEYSTORE_BASE64          the release keystore file as base64 (macOS: base64 -i release.keystore | pbcopy)
#   BUDGETAPP_RELEASE_STORE_PASSWORD   from ~/.gradle/gradle.properties
#   BUDGETAPP_RELEASE_KEY_ALIAS        from ~/.gradle/gradle.properties
#   BUDGETAPP_RELEASE_KEY_PASSWORD     from ~/.gradle/gradle.properties
# Without them the build stops: an APK signed with another key can't update the installed app (it would have to be
# uninstalled, which deletes its transactions).
name: Android release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

env:
  # the run that built 1.0.0: later runs are 1.0.1, 1.0.2, … (moved here when 1.0.0 was rebuilt with everything since)
  VERSION_BASE_RUN: 76
  KEEP_RELEASES: 5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # the whole history: the versionCode is the number of commits (android/app/build.gradle)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: echo "name=1.0.$(( ${{ github.run_number }} - VERSION_BASE_RUN ))" >> "$GITHUB_OUTPUT"

      - name: Check the release key secrets
        env:
          KEYSTORE: ${{ secrets.BUDGETAPP_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BUDGETAPP_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUDGETAPP_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUDGETAPP_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release key secrets are not set (see the comment at the top of this workflow)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install JS dependencies
        run: npm ci

      - name: Tests
        # the types, the architecture (ARCHITECTURE.md: layers' imports, file sizes; errors stop the release), the tests
        run: npx tsc --noEmit && npm run lint && npx jest --silent

      - name: Release keystore
        env:
          KEYSTORE: ${{ secrets.BUDGETAPP_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build the release APK
        working-directory: android
        env:
          # Gradle reads ORG_GRADLE_PROJECT_* as project properties: the same names as in ~/.gradle/gradle.properties
          ORG_GRADLE_PROJECT_BUDGETAPP_RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          ORG_GRADLE_PROJECT_BUDGETAPP_RELEASE_STORE_PASSWORD: ${{ secrets.BUDGETAPP_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_BUDGETAPP_RELEASE_KEY_ALIAS: ${{ secrets.BUDGETAPP_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_BUDGETAPP_RELEASE_KEY_PASSWORD: ${{ secrets.BUDGETAPP_RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_BUDGETAPP_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/budget-app-${{ steps.version.outputs.name }}.apk"

      # a version published before under the same number (the numbering restarted): replaced, not mixed with it
      - name: Free the version's tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v${{ steps.version.outputs.name }}" --cleanup-tag -y || true

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: ${{ steps.version.outputs.name }}
          body: |
            Коммит ${{ github.sha }}: ${{ github.event.head_commit.message }}

            Скачайте `budget-app-${{ steps.version.outputs.name }}.apk` на телефоне и откройте — установится поверх, данные сохранятся.
          files: ${{ runner.temp }}/budget-app-${{ steps.version.outputs.name }}.apk
          make_latest: true

      # the old per-push "Сборка N" releases, and versions older than the last KEEP_RELEASES, go with their tags
      - name: Drop old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[].tagName' > "$RUNNER_TEMP/releases"
          CURRENT="${{ steps.version.outputs.name }}"
          # versions numbered above this one are from before the numbering restarted
          NEWER=$(grep '^v1\.0\.' "$RUNNER_TEMP/releases" | while read -r tag; do [ "${tag#v1.0.}" -gt "${CURRENT#1.0.}" ] && echo "$tag"; done || true)
          { grep '^build-' "$RUNNER_TEMP/releases" || true; echo "$NEWER"; grep '^v' "$RUNNER_TEMP/releases" | tail -n +$(( KEEP_RELEASES + 1 )) || true; } \
            | sort -u | while read -r tag; do [ -n "$tag" ] && gh release delete "$tag" --cleanup-tag -y || true; done

