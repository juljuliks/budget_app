# Builds the phone release APK (arm64-v8a), signed with the app's release key, on every push to main (or by hand
# from the Actions tab), and publishes it as a GitHub release "1.0.N": budget-app-1.0.N-arm64-v8a.apk. The emulator
# build is not attached. N counts the builds since 1.0.0; only the last KEEP_RELEASES releases are kept.
# The checks, the tests (four shards) and the build run side by side (jobs check, test, build); publish waits for all.
# Cached: node_modules (by the lockfile), Gradle's dependencies and build cache (setup-gradle), the Android SDK's parts.
#
# One-time setup (repo → Settings → Secrets and variables → Actions → New repository secret):
#   BUDGETAPP_KEYSTORE_BASE64          the release keystore file as base64 (macOS: base64 -i release.keystore | pbcopy)
#   BUDGETAPP_RELEASE_STORE_PASSWORD   from ~/.gradle/gradle.properties
#   BUDGETAPP_RELEASE_KEY_ALIAS        from ~/.gradle/gradle.properties
#   BUDGETAPP_RELEASE_KEY_PASSWORD     from ~/.gradle/gradle.properties
# Without them the build stops: an APK signed with another key can't update the installed app (it would have to be
# uninstalled, which deletes its transactions).
#   FIREBASE_SERVICE_ACCOUNT           optional: a Firebase service account's key (JSON) — the release's push to the
#                                      phones (scripts/notify-release.mjs); unset — no push, the app's daily check only
#   GOOGLE_SERVICES_JSON               optional: android/app/google-services.json as base64, when it isn't in the repo
name: Android release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

env:
  # the run that built 1.0.0: later runs are 1.0.1, 1.0.2, … (moved here when 1.0.0 was rebuilt with everything since)
  VERSION_BASE_RUN: 76
  KEEP_RELEASES: 5

jobs:
  # the types and the architecture (ARCHITECTURE.md: layers' imports, file sizes; errors stop the release)
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # node_modules itself, by the lockfile: npm ci only when it changed
      - name: node_modules cache
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install JS dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Types and architecture
        run: npx tsc --noEmit && npm run lint

  # the tests, in four parts side by side (Jest splits them by file); all of them, the checks and the build run at once,
  # the release is published only when every one passes
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: node_modules cache
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install JS dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Tests ${{ matrix.shard }}/4
        run: npx jest --silent --shard=${{ matrix.shard }}/4

  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      # the whole history: the versionCode is the number of commits (android/app/build.gradle)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: version
        run: echo "name=1.0.$(( ${{ github.run_number }} - VERSION_BASE_RUN ))" >> "$GITHUB_OUTPUT"

      - name: Check the release key secrets
        env:
          KEYSTORE: ${{ secrets.BUDGETAPP_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BUDGETAPP_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUDGETAPP_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUDGETAPP_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release key secrets are not set (see the comment at the top of this workflow)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: node_modules cache
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install JS dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # the dependencies and Gradle's build cache (the libraries' compiled modules come from it), saved by every build
      # on main
      - uses: gradle/actions/setup-gradle@v4
        with:
          # the cleanup of old cache entries runs Gradle once more after the build (~30 s); the cache is rewritten anyway
          cache-cleanup: never

      # the SDK parts the build needs that the runner lacks (the NDK and CMake for the native modules, the platform and
      # build tools): otherwise downloaded by every build
      - name: Android SDK cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/23.1.7779620
            /usr/local/lib/android/sdk/cmake/3.22.1
            /usr/local/lib/android/sdk/platforms/android-33
            /usr/local/lib/android/sdk/build-tools/33.0.0
            /usr/local/lib/android/sdk/build-tools/30.0.3
          key: android-sdk-ndk-23.1.7779620-cmake-3.22.1-platform-33-build-tools-33.0.0-30.0.3

      # Firebase's config (the release's push), from the secret when the file isn't committed; none — the app builds
      # without the push
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f android/app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          fi

      - name: Release keystore
        env:
          KEYSTORE: ${{ secrets.BUDGETAPP_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build the release APK
        working-directory: android
        env:
          # Gradle reads ORG_GRADLE_PROJECT_* as project properties: the same names as in ~/.gradle/gradle.properties
          ORG_GRADLE_PROJECT_BUDGETAPP_RELEASE_STORE_FILE: ${{ runner.temp }}/release.keystore
          ORG_GRADLE_PROJECT_BUDGETAPP_RELEASE_STORE_PASSWORD: ${{ secrets.BUDGETAPP_RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_BUDGETAPP_RELEASE_KEY_ALIAS: ${{ secrets.BUDGETAPP_RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_BUDGETAPP_RELEASE_KEY_PASSWORD: ${{ secrets.BUDGETAPP_RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_BUDGETAPP_VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          chmod +x ./gradlew
          # the phone only; the emulator APK is built by the screenshots workflow and is not published. Only the app
          # (:app:, not every library's own AAR), the modules side by side, without the release lint (lintVital*)
          ./gradlew :app:assembleRelease --no-daemon --build-cache --parallel \
            -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease \
            -PabiSplits -PreactNativeArchitectures=arm64-v8a
          VERSION="${{ steps.version.outputs.name }}"
          mkdir -p "$RUNNER_TEMP/apks"
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "$RUNNER_TEMP/apks/budget-app-${VERSION}-arm64-v8a.apk"
          ls -lh "$RUNNER_TEMP/apks"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ runner.temp }}/apks/
          retention-days: 1

  publish:
    needs: [check, test, build]
    runs-on: ubuntu-latest
    env:
      # no checkout here: gh is told the repository
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: ${{ runner.temp }}/apks

      # a version published before under the same number (the numbering restarted): replaced, not mixed with it
      - name: Free the version's tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v${{ needs.build.outputs.version }}" --cleanup-tag -y || true

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          body: |
            Коммит ${{ github.sha }}: ${{ github.event.head_commit.message }}

            На телефон: `budget-app-${{ needs.build.outputs.version }}-arm64-v8a.apk` — скачайте и откройте, установится поверх, данные сохранятся.
          files: ${{ runner.temp }}/apks/budget-app-*-arm64-v8a.apk
          make_latest: true

      # the old per-push "Сборка N" releases, and versions older than the last KEEP_RELEASES, go with their tags
      - name: Drop old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt -q 'sort_by(.createdAt) | reverse | .[].tagName' > "$RUNNER_TEMP/releases"
          CURRENT="${{ needs.build.outputs.version }}"
          # versions numbered above this one are from before the numbering restarted
          NEWER=$(grep '^v1\.0\.' "$RUNNER_TEMP/releases" | while read -r tag; do [ "${tag#v1.0.}" -gt "${CURRENT#1.0.}" ] && echo "$tag"; done || true)
          { grep '^build-' "$RUNNER_TEMP/releases" || true; echo "$NEWER"; grep '^v' "$RUNNER_TEMP/releases" | tail -n +$(( KEEP_RELEASES + 1 )) || true; } \
            | sort -u | while read -r tag; do [ -n "$tag" ] && gh release delete "$tag" --cleanup-tag -y || true; done

      # the phones told: a data message to the topic "releases" (the app says «Доступна версия 1.0.N» for every newer one)
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Push the release to the phones
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/notify-release.mjs "${{ needs.build.outputs.version }}"
