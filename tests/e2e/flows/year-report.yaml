# 8.2.4: «Итоги 2026» in the shade; a tap — the year's stories, «Ваш 2026 в цифрах».
appId: com.budgetapp
---
# the shade is opened by the hook
- tapOn: "Итоги 20[0-9][0-9]"
- extendedWaitUntil:
    visible: "Ваш 20[0-9][0-9] в цифрах"
    timeout: 30000
- assertVisible: "Отложено за .*"
- tapOn: "Дальше ›"
- assertVisible: ".* — в плане"
