# 8.2.4: «Итоги 2026» in the shade; a tap — the year's stories while fresh (24 December — 7 January), else «Статистика
# за год» on that year (the year's report as a page).
appId: com.budgetapp
---
# the shade is opened by the hook
- tapOn: "Итоги 20[0-9][0-9]"
- extendedWaitUntil:
    visible: "(Ваш 20[0-9][0-9] в цифрах|По месяцам)"
    timeout: 30000
- assertVisible: "Отложено за .*"
